services:
  starrocks-fe-0:
    image: starrocks/fe-ubuntu:4.0-latest
    hostname: starrocks-fe-0
    restart: on-failure:5
    container_name: starrocks-fe-0
    command:
      - /bin/bash
      - -c
      - |
        /opt/starrocks/fe_entrypoint.sh starrocks-fe-0
    environment:
      - HOST_TYPE=FQDN
      - TZ=Asia/Jakarta
#      - MYSQL_PWD=1234567890
    mem_limit: 16g
    mem_reservation: 12g
    cpus: "4.0"
    ports:
      - "1030:8030"
      - "2020:9020"
      - "3030:9030"
    volumes:
       - ./1fe3be_fe0_data/_data:/opt/starrocks/fe/meta

  starrocks-be-0:
    image: starrocks/be-ubuntu:4.0-latest
    hostname: starrocks-be-0
    container_name: starrocks-be-0
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc:
        soft: 65535
        hard: 65535
    restart: on-failure:5
    command:
      - /bin/bash
      - -c
      - |
        /opt/starrocks/be_entrypoint.sh starrocks-fe-0
    environment:
      - HOST_TYPE=FQDN
      - TZ=Asia/Jakarta
      - MYSQL_PWD=1234567890
    ports:
      - "8040:8040"
    mem_limit: 60g
    mem_reservation: 60g
    cpus: "8.0"
    depends_on:
      - starrocks-fe-0
    volumes:
      - ./1fe3be_be0_data/_data:/opt/starrocks/be/storage

  starrocks-be-1:
    image: starrocks/be-ubuntu:4.0-latest
    hostname: starrocks-be-1
    restart: on-failure:5
    container_name: starrocks-be-1
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc:
        soft: 65535
        hard: 65535
    command:
      - /bin/bash
      - -c
      - |
        /opt/starrocks/be_entrypoint.sh starrocks-fe-0
    environment:
      - HOST_TYPE=FQDN
      - TZ=Asia/Jakarta
      - MYSQL_PWD=1234567890
    mem_limit: 60g
    mem_reservation: 60g
    cpus: "8.0"
    depends_on:
      - starrocks-fe-0
    volumes:
      - ./1fe3be_be1_data/_data:/opt/starrocks/be/storage

  starrocks-be-2:
    image: starrocks/be-ubuntu:4.0-latest
    hostname: starrocks-be-2
    container_name: starrocks-be-2
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc:
        soft: 65535
        hard: 65535
    restart: on-failure:5
    command:
      - /bin/bash
      - -c
      - |
        /opt/starrocks/be_entrypoint.sh starrocks-fe-0
    environment:
      - HOST_TYPE=FQDN
      - TZ=Asia/Jakarta
      - MYSQL_PWD=1234567890
    mem_limit: 60g
    mem_reservation: 60g
    cpus: "8.0"
    depends_on:
      - starrocks-fe-0
    volumes:
      - ./1fe3be_be2_data/_data:/opt/starrocks/be/storage
